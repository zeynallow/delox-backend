version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: delox
      POSTGRES_USER: delox_user
      POSTGRES_PASSWORD: delox_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - delox-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - delox-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: delox
      RABBITMQ_DEFAULT_PASS: delox_password
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - delox-network

  # API Gateway
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "8080:80"
      - "8443:443"
      - "8081:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - delox-network

  # Microservices
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://delox_user:delox_password@postgres:5432/delox
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
    depends_on:
      - postgres
      - redis
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-service.rule=Host(`localhost`) && PathPrefix(`/api/v1/auth`)"
      - "traefik.http.services.auth-service.loadbalancer.server.port=8000"
    networks:
      - delox-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://delox_user:delox_password@postgres:5432/delox
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:8000
    depends_on:
      - postgres
      - redis
      - auth-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-service.rule=Host(`localhost`) && PathPrefix(`/api/v1/users`)"
      - "traefik.http.services.user-service.loadbalancer.server.port=8000"
    networks:
      - delox-network

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://delox_user:delox_password@postgres:5432/delox
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://delox:delox_password@rabbitmq:5672/
      - AUTH_SERVICE_URL=http://auth-service:8000
      - USER_SERVICE_URL=http://user-service:8000
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - auth-service
      - user-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.order-service.rule=Host(`localhost`) && PathPrefix(`/api/v1/orders`)"
      - "traefik.http.services.order-service.loadbalancer.server.port=8000"
    networks:
      - delox-network

  courier-service:
    build:
      context: ./services/courier-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://delox_user:delox_password@postgres:5432/delox
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://delox:delox_password@rabbitmq:5672/
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - GOOGLE_MAPS_API_KEY=your-google-maps-api-key
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - auth-service
      - order-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.courier-service.rule=Host(`localhost`) && PathPrefix(`/api/v1/couriers`)"
      - "traefik.http.services.courier-service.loadbalancer.server.port=8000"
    networks:
      - delox-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://delox_user:delox_password@postgres:5432/delox
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://delox:delox_password@rabbitmq:5672/
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=your-email@gmail.com
      - SMTP_PASSWORD=your-app-password
      - FCM_SERVER_KEY=your-fcm-server-key
    depends_on:
      - postgres
      - redis
      - rabbitmq
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification-service.rule=Host(`localhost`) && PathPrefix(`/api/v1/notifications`)"
      - "traefik.http.services.notification-service.loadbalancer.server.port=8000"
    networks:
      - delox-network

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://delox_user:delox_password@postgres:5432/delox
      - REDIS_URL=redis://redis:6379
      - ORDER_SERVICE_URL=http://order-service:8000
      - COURIER_SERVICE_URL=http://courier-service:8000
    depends_on:
      - postgres
      - redis
      - order-service
      - courier-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.analytics-service.rule=Host(`localhost`) && PathPrefix(`/api/v1/analytics`)"
      - "traefik.http.services.analytics-service.loadbalancer.server.port=8000"
    networks:
      - delox-network

volumes:
  postgres_data:

networks:
  delox-network:
    driver: bridge
